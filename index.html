<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi - Tripoint Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white shadow-lg rounded-2xl w-full max-w-md p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Tripoint Mart</h1>
            <p class="text-sm text-slate-500">Sistem Absensi Karyawan</p>
        </div>

        <form id="attendanceForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Karyawan</label>
                <input type="text" id="nama" required placeholder="Masukkan nama lengkap" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Absensi</label>
                <select id="tipe" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Masuk">Masuk Kerja</option>
                    <option value="Istirahat">Istirahat</option>
                    <option value="Pulang">Pulang Kerja</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Status Kehadiran</label>
                <select id="status" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Hadir">Hadir</option>
                    <option value="Terlambat">Terlambat</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Bukti Foto (Selfie)</label>
                <div class="flex flex-col items-center space-y-2">
                    <video id="video" autoplay playsinline class="w-full h-48 bg-black rounded-xl object-cover"></video>
                    <button type="button" id="snap" class="w-full bg-slate-800 text-white py-2 rounded-xl text-sm font-medium hover:bg-slate-700 transition">Ambil Foto</button>
                    <canvas id="canvas" class="hidden"></canvas>
                    <img id="preview" class="hidden w-full h-48 rounded-xl object-cover border">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Lokasi GPS</label>
                <input type="text" id="lokasi" readonly placeholder="Mendapatkan lokasi..." class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-slate-500 text-sm">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-lg shadow-blue-200">Kirim Absensi</button>
        </form>

        <div id="message" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyUsS3xl0X08A_FmaU3MjUfGL12J59IX4OC1XsdVM1Chb7i4fKBrFHggJAuLaV3MC6H/exec';
        let fotoBase64 = null;
        let koordinatGPS = '';

        // Akses Kamera
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const snapBtn = id => document.getElementById('snap');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal mengakses kamera: " + err); });

        document.getElementById('snap').addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            fotoBase64 = canvas.toDataURL('image/jpeg');
            
            preview.src = fotoBase64;
            preview.classList.remove('hidden');
            video.classList.add('hidden');
        });

        // Ambil Lokasi GPS
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                koordinatGPS = `${position.coords.latitude}, ${position.coords.longitude}`;
                document.getElementById('lokasi').value = koordinatGPS;
            }, error => {
                document.getElementById('lokasi').value = "Gagal mendeteksi GPS (Aktifkan Lokasi)";
            });
        } else {
            document.getElementById('lokasi').value = "GPS tidak didukung browser ini";
        }

        // Submit Form
        const form = document.getElementById('attendanceForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            if (!fotoBase64) {
                alert('Silakan ambil foto terlebih dahulu!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Mengirim...';

            const data = {
                nama: document.getElementById('nama').value,
                tipe: document.getElementById('tipe').value,
                status: document.getElementById('status').value,
                lokasi: koordinatGPS,
                foto: fotoBase64
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
                .then(response => {
                    document.getElementById('message').innerText = 'Absensi berhasil dikirim!';
                    document.getElementById('message').className = 'mt-4 text-center text-sm font-medium text-green-600';
                    setTimeout(() => location.reload(), 2000);
                })
                .catch(error => {
                    document.getElementById('message').innerText = 'Gagal mengirim absensi!';
                    document.getElementById('message').className = 'mt-4 text-center text-sm font-medium text-red-600';
                    btn.disabled = false;
                    btn.innerText = 'Kirim Absensi';
                });
        });
    </script>
</body>
</html>
